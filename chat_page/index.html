<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Photo-Doc</title>
  <img src="" alt="">
  <link rel="icon" type="image/x-icon" href="../photos/pngtree-reload-vector-icon-png-image_696434.jpg">
</head>

<body>
  <div id="whole_page">
    <!-- This is the not navagation bar for when switching from different webpages -->
    <div class="topnav">
      <a class="" href="../home_page/home.html">Home</a>
      <a class="active" href="index.html">Chat</a>
      <a class="" href="../docs_page/docs.html">Docs</a>
    </div>

    <!-- this is used to enlarge one side more then the other if needed -->
    <div class="split-container">
      <div class="panel left-panel">
        <div id="addlink">
          <input type="text" id="link" placeholder="Enter Doc Link here">
          <button id="linkbutton">Add Link</button>
        </div>
        <div id="whole-box">
          <div id="chat-box"></div>
          <input type="text" id="user-input" placeholder="Type a message..." />
          <button id="send-btn">Send</button>
        </div>
        <div id="files">
    <!-- Added the 'multiple' attribute so you can select more than one image -->
    <input type="file" id="file_button" name='filename' accept="image/*" multiple>
    <br>
    <!-- Keep this container empty; script.js will dynamically add the thumbnails here -->
    <div id="preview-container" style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px;"></div>
</div>


      </div>
      <div class="resizer" id="dragMe"></div>
      <div class="panel, right-panel">
        <button id="reload_button"><img src="../photos/pngtree-reload-vector-icon-png-image_696434-removebg-preview (1).png" alt=""
            class="photo"></button>
        <!-- this is how i input the doc inside the web page -->
        <iframe src="https://docs.google.com/document/d/18rB12uyaOop67Sj5Ep_HiLmKW7C3yWx-mmGWbexusiQ/preview?=minimal"
          frameborder="0" id="doc"></iframe>
      </div>
    </div>
  </div>



  <!-- FOR CHAT BOX WITH AI, NEED TO UNDERSTAND -->
<script type="module" src="script.js"></script>
</body>

</html>
